name: companion

on:
  pull_request:
    paths: ["companion/**", ".github/workflows/companion.yml"]
  push:
    branches: [main]
    paths: ["companion/**", ".github/workflows/companion.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: docker build -t skp-companion .
