name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Stop — don't file it here. Use the private
        channels in [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. iOS 19, Windows 11, Docker on Ubuntu 24.04
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Redact anything secret. Never paste vault contents.
      render: text
