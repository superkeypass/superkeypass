[project]
name = "skp-companion"
version = "0.1.0"
description = "SuperkeyPass companion service for Vaultwarden: tamper alerts, exposure reports, recovery sheets."
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "segno>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
skp-companion = "skp_companion.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["skp_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
